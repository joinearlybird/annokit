# A pull request that changes the published package must raise its version.
#
# Merging is the release (release.yml publishes whatever version main has
# that npm does not), so a PR that changes src/ without `npm run bump` would
# merge code that never reaches anyone. Docs, tests, examples and CI need no
# bump. For a change to shipped files that should still wait for the next
# release (a comment, a rename with no effect), add the `no release` label.
name: Version

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  bump:
    name: version bumped for shipped changes
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The checkout is this PR merged into main as main is NOW, so the diff
      # is only this PR's changes, and a version another PR already took is
      # caught here rather than at release.
      - run: node scripts/version.mjs gate origin/${{ github.base_ref }}
